<ion-header>
  <ion-toolbar>
    <ion-title>Publicaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button (click)="openPostModal()" expand="block">
    <ion-icon name="add" slot="start"></ion-icon>
    Añadir publicación
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let post of posts">
      <ion-label>{{ post.content }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
